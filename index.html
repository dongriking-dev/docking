<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Dg 完全主導型マスターコントロール Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Cpath fill='%23ffffff' d='M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z'/%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            position: relative;
            color: #1e293b;
        }

        #particle-canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .dragon-logo-top-left {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            fill: #ffffff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            pointer-events: none;
            z-index: 5;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 28px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            max-width: 720px;
            width: 100%;
            margin: auto;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            max-height: 92vh;
            overflow-y: auto;
        }
        h2, h3 {
            margin-top: 0;
            color: #1e293b;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 8px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
            font-size: 0.95rem;
        }
        input[type="url"],
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            background: #fafbfc;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: white;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-primary:hover { background: #1d4ed8; transform: scale(1.01); }
        .btn-success {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-success:hover { background: #16a34a; }
        .btn-warning {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-warning:hover { background: #d97706; }
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger:hover { background: #b91c1c; }

        .btn-icon {
            background: #64748b;
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.15s;
            flex-shrink: 0;
        }
        .btn-icon:hover { background: #475569; }

        #resultZone {
            margin-top: 15px;
            padding: 14px;
            background: #f1f5f9;
            border-left: 6px solid #22c55e;
            border-radius: 10px;
            display: none;
        }
        .link-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            align-items: center;
        }
        .generated-link {
            flex: 1;
            background: #22c55e;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: 700;
            text-align: center;
            font-size: 0.9rem;
            word-break: break-all;
            display: inline-block;
        }
        .btn-copy {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-copy.copied { background: #22c55e; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-waiting { background: #e2e8f0; color: #64748b; }
        .status-connected { background: #dcfce7; color: #15803d; }

        .screen-share-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
            aspect-ratio: 16/9;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .screen-placeholder {
            color: #94a3b8;
            font-size: 0.95rem;
            position: absolute;
            text-align: center;
            padding: 0 20px;
        }

        .chat-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            height: 180px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-msg {
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .chat-msg.host { background: #dbeafe; color: #1e40af; align-self: flex-end; }
        .chat-msg.peer { background: #e2e8f0; color: #334155; align-self: flex-start; }
        
        .chat-msg img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            cursor: pointer;
            display: block;
            max-height: 200px;
            object-fit: contain;
        }

        .chat-input-row { display: flex; gap: 8px; align-items: center; }

        #executeMode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0f19;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0;
        }

        #execStatusText {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 500;
            padding: 10px;
            background: rgba(11, 15, 25, 0.8);
            width: 100%;
            z-index: 100;
        }

        #peerActiveContainer {
            display: none;
            width: 100vw;
            height: calc(100vh - 45px);
            background: #000;
            position: relative;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        #peerSharedVideoBox {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
            z-index: 1;
        }
        #localSharedVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .peer-chat-overlay {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px;
            z-index: 10;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #peerChatBox {
            background: rgba(15, 15, 25, 0.6);
            border-radius: 8px;
            height: 130px;
            overflow-y: auto;
            padding: 8px;
            text-align: left;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #fff;
        }
        .peer-chat-input-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas-bg"></canvas>

    <svg class="dragon-logo-top-left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z" />
    </svg>

    <!-- ホスト側コントロールパネル -->
    <div id="setupMode" class="card">
        <h2>👑 Dg マスターコントロール Pro</h2>

        <div class="form-group">
            <label>📍 ルーム識別子 (数字のみ・何桁でもOK)</label>
            <input type="text" id="roomIdInput" inputmode="numeric" pattern="[0-9]*" placeholder="例: 123 など">
        </div>

        <button id="generateBtn" class="btn-primary">🔗 接続リンクを発行する</button>

        <div id="resultZone">
            <strong>✅ 発行完了（このリンクを相手に踏ませよう）</strong>
            <div class="link-container">
                <a id="shareableLink" class="generated-link" href="#" target="_blank">リンクを開く</a>
                <button id="copyBtn" class="btn-copy">📋 コピー</button>
            </div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>🎛️ あなた（ホスト）からの主導コントロール</h3>
        <p>相手の状態: <span id="peerStatusBadge" class="status-badge status-waiting">待機中...</span></p>

        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button id="hostTriggerShareBtn" class="btn-success">🖥️ 相手に画面共有を要求</button>
            <button id="stopPeerShareBtn" class="btn-danger">⏹️ 相手の画面共有を停止</button>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
            <button id="hostShowMyScreenBtn" class="btn-warning">📺 自分の画面を共有する</button>
            <button id="stopMyShareBtn" class="btn-danger">⏹️ 自分の画面共有を停止</button>
        </div>

        <div class="form-group">
            <label for="targetUrlInput">🎯 相手に開かせるURL</label>
            <div style="display: flex; gap: 8px;">
                <input type="url" id="targetUrlInput" value="https://www.google.com" placeholder="https://example.com">
                <button id="sendUrlBtn" class="btn-primary" style="width: 140px;">URLを開かせる</button>
            </div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>📺 受信している相手の画面</h3>
        <div class="screen-share-box">
            <div id="screenPlaceholder" class="screen-placeholder">相手の画面共有を待っています...</div>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>💬 Jiffcy風 通話メッセージ・画像送信</h3>
        <div id="chatContainer" class="chat-box"></div>
        <div class="chat-input-row">
            <input type="file" id="hostImageInput" accept="image/*" style="display: none;">
            <button id="hostPickImgBtn" class="btn-icon" title="画像を添付">📷</button>
            <input type="text" id="chatInput" placeholder="メッセージを入力して送信...">
            <button id="sendChatBtn" class="btn-primary" style="width: 100px;">送信</button>
        </div>

        <button id="resetBtn" class="btn-danger" style="margin-top: 20px;">🔄 全システムをリセット</button>
    </div>

    <!-- 相手側 完全に受動的な画面 -->
    <div id="executeMode">
        <div id="execStatusText">接続完了：ホストからの指示を待っています...</div>

        <div id="peerActiveContainer">
            <div id="peerSharedVideoBox">
                <video id="localSharedVideo" autoplay playsinline></video>
            </div>
            <!-- チャット＆画像オーバーレイ -->
            <div class="peer-chat-overlay" id="peerChatOverlay">
                <div id="peerChatBox"></div>
                <div class="peer-chat-input-row">
                    <input type="file" id="peerImageInput" accept="image/*" style="display: none;">
                    <button id="peerPickImgBtn" class="btn-icon" title="画像を添付">📷</button>
                    <input type="text" id="peerChatInput" placeholder="メッセージを入力...">
                    <button id="peerSendChatBtn" class="btn-primary" style="width: 80px;">送信</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKの読み込みと動作処理 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClr0xKgQ_7BLMdoLltDkYhKGKMFkqAk5Q",
            authDomain: "dongurityping.firebaseapp.com",
            databaseURL: "https://dongurityping-default-rtdb.firebaseio.com",
            projectId: "dongurityping",
            storageBucket: "dongurityping.firebasestorage.app",
            messagingSenderId: "892769145761",
            appId: "1:892769145761:web:6d3f18fa7f3f1bb55f71e0",
            measurementId: "G-9N1Q9NY4RH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultRoomId = Math.floor(1000 + Math.random() * 9000).toString();
        const roomIdInput = document.getElementById('roomIdInput');
        roomIdInput.value = defaultRoomId;

        roomIdInput.addEventListener('input', () => {
            roomIdInput.value = roomIdInput.value.replace(/[^0-9]/g, '');
        });

        const urlParams = new URLSearchParams(window.location.search);
        const activeRoom = urlParams.get('room');

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // 画像ファイルをBase64文字列に変換するヘルパー
        function convertImageFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        if (activeRoom) {
            // ================= ゲスト側（相手） =================
            document.getElementById('setupMode').style.display = 'none';
            document.getElementById('executeMode').style.display = 'flex';

            const statusText = document.getElementById('execStatusText');
            const activeContainer = document.getElementById('peerActiveContainer');
            const sharedVideoBox = document.getElementById('peerSharedVideoBox');
            const localSharedVideo = document.getElementById('localSharedVideo');
            const peerChatOverlay = document.getElementById('peerChatOverlay');
            const peerChatInput = document.getElementById('peerChatInput');
            const peerSendChatBtn = document.getElementById('peerSendChatBtn');
            const peerImageInput = document.getElementById('peerImageInput');
            const peerPickImgBtn = document.getElementById('peerPickImgBtn');

            set(ref(db, 'rooms/' + activeRoom + '/status'), 'connected');

            let myScreenStream = null;
            let currentPeerPc = null;
            let hostReceivePc = null;

            onValue(ref(db, 'rooms/' + activeRoom + '/modeCommand'), async (snapshot) => {
                const cmd = snapshot.val();
                if (!cmd) return;

                if (cmd.action === 'lockAll') {
                    stopPeerScreenShareInternal();
                    statusText.innerText = "接続完了：ホストからの指示を待っています...";
                } else if (cmd.action === 'showChat') {
                    activeContainer.style.display = 'flex';
                    peerChatOverlay.style.display = 'flex';
                    statusText.innerText = "メッセージ・画像通話セッション中";
                } else if (cmd.action === 'requestScreenShare') {
                    activeContainer.style.display = 'flex';
                    sharedVideoBox.style.display = 'block';
                    peerChatOverlay.style.display = 'flex';
                    statusText.innerText = "あなたの画面を全体共有中です";

                    if (currentPeerPc) {
                        currentPeerPc.close();
                        currentPeerPc = null;
                    }

                    try {
                        myScreenStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
                        localSharedVideo.srcObject = myScreenStream;

                        currentPeerPc = new RTCPeerConnection(rtcConfig);
                        myScreenStream.getTracks().forEach(track => currentPeerPc.addTrack(track, myScreenStream));

                        currentPeerPc.onicecandidate = e => {
                            if (e.candidate) {
                                push(ref(db, 'rooms/' + activeRoom + '/rtc/peerCandidates'), e.candidate.toJSON());
                            }
                        };

                        const offer = await currentPeerPc.createOffer();
                        await currentPeerPc.setLocalDescription(offer);
                        set(ref(db, 'rooms/' + activeRoom + '/rtc/offer'), { type: offer.type, sdp: offer.sdp, time: Date.now() });

                        onValue(ref(db, 'rooms/' + activeRoom + '/rtc/answer'), async (snap) => {
                            const ans = snap.val();
                            if (ans && currentPeerPc && currentPeerPc.signalingState === 'have-local-offer') {
                                await currentPeerPc.setRemoteDescription(new RTCSessionDescription(ans));
                            }
                        });

                        onValue(ref(db, 'rooms/' + activeRoom + '/rtc/hostCandidates'), (snap) => {
                            const cands = snap.val();
                            if (cands && currentPeerPc) {
                                Object.values(cands).forEach(async c => {
                                    try { await currentPeerPc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                                });
                            }
                        });

                        myScreenStream.getVideoTracks()[0].onended = () => {
                            stopPeerScreenShare();
                        };
                    } catch(err) {
                        statusText.innerText = "画面共有がキャンセルまたは拒否されました";
                        sharedVideoBox.style.display = 'none';
                        set(ref(db, 'rooms/' + activeRoom + '/rtc/offer'), null);
                    }
                } else if (cmd.action === 'stopScreenShare') {
                    stopPeerScreenShare();
                } else if (cmd.action === 'openUrl') {
                    statusText.innerText = `指定サイトを開いています: ${cmd.url}`;
                    window.open(cmd.url, '_blank');
                }
            });

            function stopPeerScreenShareInternal() {
                if (myScreenStream) {
                    myScreenStream.getTracks().forEach(track => track.stop());
                    myScreenStream = null;
                }
                if (currentPeerPc) {
                    currentPeerPc.close();
                    currentPeerPc = null;
                }
                localSharedVideo.srcObject = null;
                sharedVideoBox.style.display = 'none';
            }

            function stopPeerScreenShare() {
                stopPeerScreenShareInternal();
                statusText.innerText = "画面共有が停止されました";
                set(ref(db, 'rooms/' + activeRoom + '/rtc/offer'), null);
                set(ref(db, 'rooms/' + activeRoom + '/rtc/peerCandidates'), null);
            }

            onValue(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/offer'), async (snapshot) => {
                const offer = snapshot.val();
                if (!offer) {
                    if (hostReceivePc) {
                        hostReceivePc.close();
                        hostReceivePc = null;
                        localSharedVideo.srcObject = null;
                        sharedVideoBox.style.display = 'none';
                        statusText.innerText = "ホストの画面共有が終了しました";
                    }
                    return;
                }

                activeContainer.style.display = 'flex';
                sharedVideoBox.style.display = 'block';
                peerChatOverlay.style.display = 'flex';
                statusText.innerText = "ホストの画面を受信中（全体表示）";

                if (hostReceivePc) {
                    hostReceivePc.close();
                }

                hostReceivePc = new RTCPeerConnection(rtcConfig);
                hostReceivePc.ontrack = e => {
                    localSharedVideo.srcObject = e.streams[0];
                };
                hostReceivePc.onicecandidate = e => {
                    if (e.candidate) {
                        push(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/peerCandidates'), e.candidate.toJSON());
                    }
                };

                await hostReceivePc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await hostReceivePc.createAnswer();
                await hostReceivePc.setLocalDescription(answer);
                set(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/answer'), { type: answer.type, sdp: answer.sdp });

                onValue(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/hostCandidates'), (snap) => {
                    const cands = snap.val();
                    if (cands && hostReceivePc) {
                        Object.values(cands).forEach(async c => {
                            try { await hostReceivePc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                        });
                    }
                });
            });

            onValue(ref(db, 'rooms/' + activeRoom + '/messages'), (snapshot) => {
                const data = snapshot.val();
                const box = document.getElementById('peerChatBox');
                box.innerHTML = '';
                if (data) {
                    activeContainer.style.display = 'flex';
                    peerChatOverlay.style.display = 'flex';
                    Object.values(data).forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'chat-msg ' + (msg.sender === 'host' ? 'host' : 'peer');
                        let contentHtml = (msg.sender === 'host' ? '👑 ホスト' : 'あなた') + ': ';
                        if (msg.text) {
                            contentHtml += `<span>${escapeHtml(msg.text)}</span>`;
                        }
                        if (msg.image) {
                            contentHtml += `<br><img src="${msg.image}" onclick="window.open('${msg.image}')">`;
                        }
                        div.innerHTML = contentHtml;
                        box.appendChild(div);
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });

            async function sendPeerChat(imageObj = null) {
                const text = peerChatInput.value.trim();
                if (!text && !imageObj) return;

                let imgData = null;
                if (imageObj) {
                    try {
                        imgData = await convertImageFileToBase64(imageObj);
                    } catch(e) {
                        alert('画像の読み込みに失敗しました');
                        return;
                    }
                }

                push(ref(db, 'rooms/' + activeRoom + '/messages'), {
                    sender: 'peer',
                    text: text || '',
                    image: imgData,
                    time: Date.now()
                });
                peerChatInput.value = '';
                peerImageInput.value = '';
            }

            peerPickImgBtn.addEventListener('click', () => peerImageInput.click());
            peerImageInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    sendPeerChat(e.target.files[0]);
                }
            });

            peerSendChatBtn.addEventListener('click', () => sendPeerChat());
            peerChatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendPeerChat();
            });

        } else {
            // ================= ホスト側 =================
            let hostScreenStream = null;
            let hostScreenPc = null;
            let peerReceivePc = null;

            const hostImageInput = document.getElementById('hostImageInput');
            const hostPickImgBtn = document.getElementById('hostPickImgBtn');

            function generateSessionLink() {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームID（数字）を入力してください');

                const baseUrl = window.location.href.split('?')[0];
                const link = baseUrl + '?room=' + rId;

                const linkElem = document.getElementById('shareableLink');
                linkElem.href = link;
                linkElem.textContent = link;
                document.getElementById('resultZone').style.display = 'block';

                set(ref(db, 'rooms/' + rId), {
                    status: 'waiting',
                    modeCommand: { action: 'lockAll' }
                });

                monitorRoom(rId);
                monitorChat(rId);
                setupWebRTCReceiver(rId);
            }

            document.getElementById('generateBtn').addEventListener('click', generateSessionLink);

            function monitorRoom(rId) {
                const badge = document.getElementById('peerStatusBadge');
                onValue(ref(db, 'rooms/' + rId + '/status'), (snapshot) => {
                    if (snapshot.val() === 'connected') {
                        badge.innerText = "相手が接続しました！制御可能";
                        badge.className = "status-badge status-connected";
                    }
                });
            }

            document.getElementById('hostTriggerShareBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームIDがありません');

                set(ref(db, 'rooms/' + rId + '/rtc/offer'), null);
                set(ref(db, 'rooms/' + rId + '/rtc/peerCandidates'), null);
                set(ref(db, 'rooms/' + rId + '/rtc/hostCandidates'), null);

                set(ref(db, 'rooms/' + rId + '/modeCommand'), {
                    action: 'requestScreenShare',
                    time: Date.now()
                });
                alert("相手に画面共有を要求しました。");
            });

            document.getElementById('stopPeerShareBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームIDがありません');

                set(ref(db, 'rooms/' + rId + '/modeCommand'), {
                    action: 'stopScreenShare',
                    time: Date.now()
                });
                if (peerReceivePc) {
                    peerReceivePc.close();
                    peerReceivePc = null;
                }
                const remoteVideo = document.getElementById('remoteVideo');
                remoteVideo.srcObject = null;
                document.getElementById('screenPlaceholder').style.display = 'flex';
                alert("相手の画面共有を停止しました。");
            });

            document.getElementById('hostShowMyScreenBtn').addEventListener('click', async () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームIDがありません');

                try {
                    hostScreenStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
                    
                    if (hostScreenPc) {
                        hostScreenPc.close();
                    }

                    set(ref(db, 'rooms/' + rId + '/rtcHostToPeer/offer'), null);
                    set(ref(db, 'rooms/' + rId + '/rtcHostToPeer/hostCandidates'), null);
                    set(ref(db, 'rooms/' + rId + '/rtcHostToPeer/peerCandidates'), null);

                    hostScreenPc = new RTCPeerConnection(rtcConfig);
                    hostScreenStream.getTracks().forEach(track => hostScreenPc.addTrack(track, hostScreenStream));

                    hostScreenPc.onicecandidate = e => {
                        if (e.candidate) {
                            push(ref(db, 'rooms/' + rId + '/rtcHostToPeer/hostCandidates'), e.candidate.toJSON());
                        }
                    };

                    const offer = await hostScreenPc.createOffer();
                    await hostScreenPc.setLocalDescription(offer);
                    set(ref(db, 'rooms/' + rId + '/rtcHostToPeer/offer'), { type: offer.type, sdp: offer.sdp, time: Date.now() });

                    onValue(ref(db, 'rooms/' + rId + '/rtcHostToPeer/answer'), async (snap) => {
                        const ans = snap.val();
                        if (ans && hostScreenPc && hostScreenPc.signalingState === 'have-local-offer') {
                            await hostScreenPc.setRemoteDescription(new RTCSessionDescription(ans));
                        }
                    });

                    onValue(ref(db, 'rooms/' + rId + '/rtcHostToPeer/peerCandidates'), (snap) => {
                        const cands = snap.val();
                        if (cands && hostScreenPc) {
                            Object.values(cands).forEach(async c => {
                                try { await hostScreenPc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                            });
                        }
                    });

                    set(ref(db, 'rooms/' + rId + '/modeCommand'), {
                        action: 'showChat',
                        time: Date.now()
                    });
                    alert("自分の画面共有を開始しました！");

                    hostScreenStream.getVideoTracks()[0].onended = () => {
                        stopHostScreenShareAction(rId);
                    };
                } catch(err) {
                    alert("画面共有がキャンセルされました。");
                }
            });

            document.getElementById('stopMyShareBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return;
                stopHostScreenShareAction(rId);
                alert("自分の画面共有を停止しました。");
            });

            function stopHostScreenShareAction(rId) {
                if (hostScreenStream) {
                    hostScreenStream.getTracks().forEach(track => track.stop());
                    hostScreenStream = null;
                }
                if (hostScreenPc) {
                    hostScreenPc.close();
                    hostScreenPc = null;
                }
                set(ref(db, 'rooms/' + rId + '/rtcHostToPeer/offer'), null);
            }

            function setupWebRTCReceiver(rId) {
                onValue(ref(db, 'rooms/' + rId + '/rtc/offer'), async (snapshot) => {
                    const offer = snapshot.val();
                    if (!offer) {
                        if (peerReceivePc) {
                            peerReceivePc.close();
                            peerReceivePc = null;
                            document.getElementById('remoteVideo').srcObject = null;
                            document.getElementById('screenPlaceholder').style.display = 'flex';
                        }
                        return;
                    }

                    if (peerReceivePc) {
                        peerReceivePc.close();
                    }

                    peerReceivePc = new RTCPeerConnection(rtcConfig);
                    peerReceivePc.ontrack = e => {
                        const remoteVideo = document.getElementById('remoteVideo');
                        remoteVideo.srcObject = e.streams[0];
                        document.getElementById('screenPlaceholder').style.display = 'none';
                    };
                    peerReceivePc.onicecandidate = e => {
                        if (e.candidate) {
                            push(ref(db, 'rooms/' + rId + '/rtc/hostCandidates'), e.candidate.toJSON());
                        }
                    };

                    await peerReceivePc.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerReceivePc.createAnswer();
                    await peerReceivePc.setLocalDescription(answer);
                    set(ref(db, 'rooms/' + rId + '/rtc/answer'), { type: answer.type, sdp: answer.sdp });

                    onValue(ref(db, 'rooms/' + rId + '/rtc/peerCandidates'), (snapshot) => {
                        const cands = snapshot.val();
                        if (cands && peerReceivePc) {
                            Object.values(cands).forEach(async c => {
                                try { await peerReceivePc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                            });
                        }
                    });
                });
            }

            document.getElementById('sendUrlBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                const targetUrl = document.getElementById('targetUrlInput').value.trim();
                if (!rId || !targetUrl) return alert('IDまたはURLを入力してください');

                set(ref(db, 'rooms/' + rId + '/modeCommand'), {
                    action: 'openUrl',
                    url: targetUrl,
                    time: Date.now()
                }).then(() => {
                    alert("指定URLを相手の画面で開かせました！");
                });
            });

            async function sendHostChat(imageObj = null) {
                const rId = document.getElementById('roomIdInput').value.trim();
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if ((!text && !imageObj) || !rId) return;

                let imgData = null;
                if (imageObj) {
                    try {
                        imgData = await convertImageFileToBase64(imageObj);
                    } catch(e) {
                        alert('画像の読み込みに失敗しました');
                        return;
                    }
                }

                push(ref(db, 'rooms/' + rId + '/messages'), {
                    sender: 'host',
                    text: text || '',
                    image: imgData,
                    time: Date.now()
                });
                input.value = '';
                hostImageInput.value = '';
            }

            hostPickImgBtn.addEventListener('click', () => hostImageInput.click());
            hostImageInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    sendHostChat(e.target.files[0]);
                }
            });

            document.getElementById('sendChatBtn').addEventListener('click', () => sendHostChat());
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendHostChat();
            });

            function monitorChat(rId) {
                onValue(ref(db, 'rooms/' + rId + '/messages'), (snapshot) => {
                    const data = snapshot.val();
                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = '';
                    if (data) {
                        Object.values(data).forEach(msg => {
                            const div = document.createElement('div');
                            div.className = 'chat-msg ' + msg.sender;
                            let contentHtml = (msg.sender === 'host' ? '自分' : '相手') + ': ';
                            if (msg.text) {
                                contentHtml += `<span>${escapeHtml(msg.text)}</span>`;
                            }
                            if (msg.image) {
                                contentHtml += `<br><img src="${msg.image}" onclick="window.open('${msg.image}')">`;
                            }
                            div.innerHTML = contentHtml;
                            chatContainer.appendChild(div);
                        });
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                });
            }

            document.getElementById('resetBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return;
                remove(ref(db, 'rooms/' + rId));
                alert("システムをリセットしました。");
                location.reload();
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const link = document.getElementById('shareableLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ コピー完了！';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋 コピー'; btn.classList.remove('copied'); }, 2000);
            });
        });

        // 背景粒子アニメーション
        const canvas = document.getElementById('particle-canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + this.alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 40; i++) {
            let p = new Particle();
            p.y = Math.random() * canvas.height;
            particles.push(p);
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(c => { c.update(); c.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
