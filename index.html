<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Dg.t Docking</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Cpath fill='%23ffffff' d='M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z'/%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            position: relative;
            color: #1e293b;
        }
        #particle-canvas-bg {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
        }
        .dragon-logo-top-left {
            position: fixed; top: 20px; left: 20px;
            width: 50px; height: 50px;
            fill: #ffffff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            pointer-events: none; z-index: 5;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 28px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            max-width: 900px; width: 100%;
            margin: 20px auto; position: relative; z-index: 10;
            backdrop-filter: blur(5px);
        }
        h2, h3 {
            margin-top: 0; color: #1e293b;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 8px; font-weight: 600;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block; font-weight: 600;
            margin-bottom: 6px; color: #334155;
            font-size: 0.95rem;
        }
        input[type="url"], input[type="text"], input[type="number"] {
            width: 100%; padding: 12px 14px;
            border: 1px solid #d1d5db; border-radius: 10px;
            font-size: 1rem; background: #fafbfc;
            transition: 0.2s;
        }
        input:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: white;
        }
        .btn-primary {
            background: #2563eb; color: white; border: none;
            padding: 12px 20px; font-size: 1rem; font-weight: 600;
            border-radius: 30px; cursor: pointer; width: 100%;
            transition: 0.15s;
        }
        .btn-primary:hover { background: #1d4ed8; transform: scale(1.01); }
        .btn-success {
            background: #22c55e; color: white; border: none;
            padding: 12px 20px; font-size: 1rem; font-weight: 600;
            border-radius: 30px; cursor: pointer; width: 100%;
            transition: 0.15s;
        }
        .btn-success:hover { background: #16a34a; }
        .btn-danger {
            background: #dc2626; color: white; border: none;
            padding: 12px 20px; font-size: 1rem; font-weight: 600;
            border-radius: 30px; cursor: pointer; width: 100%;
            margin-top: 10px;
        }
        .btn-danger:hover { background: #b91c1c; }
        .btn-icon {
            background: #64748b; color: white; border: none;
            width: 42px; height: 42px; border-radius: 10px;
            font-size: 1.1rem; display: flex;
            justify-content: center; align-items: center;
            cursor: pointer; transition: 0.15s; flex-shrink: 0;
        }
        .btn-icon:hover { background: #475569; }
        #resultZone {
            margin-top: 15px; padding: 14px;
            background: #f1f5f9;
            border-left: 6px solid #22c55e;
            border-radius: 10px; display: none;
        }
        .link-container {
            display: flex; gap: 10px;
            margin-top: 8px; align-items: center;
        }
        .generated-link {
            flex: 1; background: #22c55e; color: white;
            text-decoration: none; padding: 10px 15px;
            border-radius: 30px; font-weight: 700;
            text-align: center; font-size: 0.9rem;
            word-break: break-all; display: inline-block;
        }
        .btn-copy {
            background: #64748b; color: white; border: none;
            padding: 10px 16px; border-radius: 30px;
            font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-copy.copied { background: #22c55e; }

        .peer-panel {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .peer-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .peer-panel-title {
            font-weight: 700;
            font-size: 1rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .peer-id-badge {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .screen-share-box {
            width: 100%; background: #000;
            border-radius: 12px; overflow: hidden;
            margin-top: 10px; position: relative;
            aspect-ratio: 16/9; display: flex;
            justify-content: center; align-items: center;
        }
        .remote-video {
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .screen-placeholder {
            color: #94a3b8; font-size: 0.95rem;
            position: absolute; text-align: center;
            padding: 0 20px;
        }

        .peer-chat-section {
            margin-top: 12px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 10px;
        }
        .peer-chat-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .peer-chat-box {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .peer-chat-box .chat-msg {
            font-size: 0.85rem;
        }
        .chat-msg {
            padding: 8px 12px; border-radius: 10px;
            max-width: 80%; font-size: 0.9rem;
            word-break: break-all;
        }
        .chat-msg.host { background: #dbeafe; color: #1e40af; align-self: flex-end; }
        .chat-msg.peer { background: #e2e8f0; color: #334155; align-self: flex-start; }
        .chat-msg img {
            max-width: 100%; border-radius: 8px;
            margin-top: 4px; cursor: pointer;
            display: block; max-height: 180px;
            object-fit: contain;
        }
        .peer-chat-input-row {
            display: flex; gap: 6px; align-items: center;
        }

        #executeMode {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b0f19; z-index: 9999;
            flex-direction: column; justify-content: center;
            align-items: center; color: white;
            text-align: center; padding: 0;
        }
        #execStatusText {
            font-size: 1rem; color: #94a3b8;
            font-weight: 500; padding: 10px;
            background: rgba(11, 15, 25, 0.8);
            width: 100%; z-index: 100;
        }
        #peerActiveContainer {
            display: none; width: 100vw;
            height: calc(100vh - 45px); background: #000;
            position: relative; flex-direction: column;
            justify-content: space-between; align-items: center;
            overflow: hidden;
        }
        #peerSharedVideoBox {
            display: none; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            background: #000; z-index: 1;
        }
        #localSharedVideo {
            width: 100%; height: 100%; object-fit: contain;
        }
        .peer-chat-overlay {
            position: absolute; bottom: 15px; left: 50%;
            transform: translateX(-50%); width: 90%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px; padding: 12px;
            z-index: 10; display: none;
            flex-direction: column; gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.25s ease, opacity 0.25s ease;
        }
        .peer-chat-overlay.pop-in {
            animation: chatPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes chatPopIn {
            0% { transform: translateX(-50%) translateY(30px) scale(0.9); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        }
        #peerChatBox {
            background: rgba(15, 15, 25, 0.6);
            border-radius: 8px; height: 130px;
            overflow-y: auto; padding: 8px;
            text-align: left; font-size: 0.85rem;
            display: flex; flex-direction: column;
            gap: 6px; color: #fff;
        }
        .peer-chat-overlay .chat-msg.host { background: rgba(37, 99, 235, 0.5); color: #fff; }
        .peer-chat-overlay .chat-msg.peer { background: rgba(148, 163, 184, 0.3); color: #fff; }
        .peer-chat-overlay .chat-msg.new-msg {
            animation: msgFlash 1.2s ease-out;
        }
        @keyframes msgFlash {
            0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.9); transform: scale(1.03); }
            100% { box-shadow: 0 0 0 12px rgba(96, 165, 250, 0); transform: scale(1); }
        }
        .peer-chat-input-row {
            display: flex; gap: 6px; align-items: center;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas-bg"></canvas>

    <svg class="dragon-logo-top-left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z" />
    </svg>

    <div id="setupMode" class="card">
        <h2>👑 Dg マスターコントロール Pro</h2>

        <div class="form-group">
            <label>📍 ルーム識別子 (数字のみ・何桁でもOK)</label>
            <input type="text" id="roomIdInput" inputmode="numeric" pattern="[0-9]*" placeholder="例: 123 など">
        </div>

        <button id="generateBtn" class="btn-primary">🔗 接続リンクを発行する</button>

        <div id="resultZone">
            <strong>✅ 発行完了（このリンクを相手に踏ませよう）</strong>
            <div class="link-container">
                <a id="shareableLink" class="generated-link" href="#" target="_blank">リンクを開く</a>
                <button id="copyBtn" class="btn-copy">📋 コピー</button>
            </div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>🎛️ 接続中の相手（<span id="peerCount">0</span>人）</h3>
        <p style="color:#64748b; font-size:0.9rem; margin-top:-8px;">
            メッセージを送ると、相手の画面に即座に表示されます。
        </p>

        <div id="peerPanelsContainer">
            <div id="noPeerMessage" style="text-align:center; padding:20px; color:#94a3b8;">
                まだ誰も接続していません...
            </div>
        </div>

        <button id="resetBtn" class="btn-danger" style="margin-top: 20px;">🔄 全システムをリセット</button>
    </div>

    <div id="executeMode">
        <div id="execStatusText">接続完了：ホストからの指示を待っています...</div>

        <div id="peerActiveContainer">
            <div id="peerSharedVideoBox">
                <video id="localSharedVideo" autoplay playsinline></video>
            </div>
            <div class="peer-chat-overlay" id="peerChatOverlay">
                <div id="peerChatBox"></div>
                <div class="peer-chat-input-row">
                    <input type="file" id="peerImageInput" accept="image/*" style="display: none;">
                    <button id="peerPickImgBtn" class="btn-icon" title="画像を添付">📷</button>
                    <input type="text" id="peerChatInput" placeholder="メッセージを入力...">
                    <button id="peerSendChatBtn" class="btn-primary" style="width: 80px;">送信</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClr0xKgQ_7BLMdoLltDkYhKGKMFkqAk5Q",
            authDomain: "dongurityping.firebaseapp.com",
            databaseURL: "https://dongurityping-default-rtdb.firebaseio.com",
            projectId: "dongurityping",
            storageBucket: "dongurityping.firebasestorage.app",
            messagingSenderId: "892769145761",
            appId: "1:892769145761:web:6d3f18fa7f3f1bb55f71e0",
            measurementId: "G-9N1Q9NY4RH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ============================================================
        //  タブタイトル管理
        // ============================================================
        const BASE_TITLE = 'Dg.t Docking';
        const UNREAD_PREFIX = '◉ ';
        document.title = BASE_TITLE;

        let hasUnread = false;
        function setUnreadTitle(unread) {
            hasUnread = unread;
            document.title = unread ? (UNREAD_PREFIX + BASE_TITLE) : BASE_TITLE;
        }
        function clearUnreadIfVisible() {
            if (!document.hidden && hasUnread) setUnreadTitle(false);
        }
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) clearUnreadIfVisible();
        });
        window.addEventListener('focus', clearUnreadIfVisible);

        // ============================================================
        //  ユーティリティ
        // ============================================================
        const defaultRoomId = Math.floor(1000 + Math.random() * 9000).toString();
        const roomIdInput = document.getElementById('roomIdInput');
        roomIdInput.value = defaultRoomId;

        roomIdInput.addEventListener('input', () => {
            roomIdInput.value = roomIdInput.value.replace(/[^0-9]/g, '');
        });

        const urlParams = new URLSearchParams(window.location.search);
        const activeRoom = urlParams.get('room');

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function generatePeerId() {
            return 'peer_' + Math.random().toString(36).substring(2, 10);
        }

        function convertImageFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderChatMessage(msg, viewerIsHost, isNew = false) {
            const div = document.createElement('div');
            div.className = 'chat-msg ' + (msg.sender === 'host' ? 'host' : 'peer');
            if (isNew) div.classList.add('new-msg');
            let label;
            if (viewerIsHost) {
                label = msg.sender === 'host' ? '自分' : '相手';
            } else {
                label = msg.sender === 'host' ? '👑 ホスト' : 'あなた';
            }
            let html = label + ': ';
            if (msg.text) html += `<span>${escapeHtml(msg.text)}</span>`;
            if (msg.image) html += `<br><img src="${msg.image}" onclick="window.open(this.src)">`;
            div.innerHTML = html;
            return div;
        }

        // ============================================================
        //  ゲスト側（相手）
        // ============================================================
        if (activeRoom) {
            document.getElementById('setupMode').style.display = 'none';
            document.getElementById('executeMode').style.display = 'flex';

            const statusText = document.getElementById('execStatusText');
            const activeContainer = document.getElementById('peerActiveContainer');
            const sharedVideoBox = document.getElementById('peerSharedVideoBox');
            const localSharedVideo = document.getElementById('localSharedVideo');
            const peerChatOverlay = document.getElementById('peerChatOverlay');
            const peerChatInput = document.getElementById('peerChatInput');
            const peerSendChatBtn = document.getElementById('peerSendChatBtn');
            const peerImageInput = document.getElementById('peerImageInput');
            const peerPickImgBtn = document.getElementById('peerPickImgBtn');

            const myPeerId = generatePeerId();
            const myPeerRef = ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId);

            set(myPeerRef, {
                joinedAt: Date.now(),
                online: true,
                chatVisible: false
            });

            window.addEventListener('beforeunload', () => {
                remove(myPeerRef);
                if (myScreenStream) myScreenStream.getTracks().forEach(t => t.stop());
                if (myScreenPc) myScreenPc.close();
            });

            let myScreenStream = null;
            let myScreenPc = null;
            let myScreenAnswerUnsub = null;
            let myScreenHostCandUnsub = null;
            let isScreenSharing = false;

            const knownMessageIds = new Set();
            let messageListenerInitialized = false;

            function stopMyScreenShareInternal() {
                if (myScreenStream) {
                    myScreenStream.getTracks().forEach(t => t.stop());
                    myScreenStream = null;
                }
                if (myScreenPc) {
                    myScreenPc.close();
                    myScreenPc = null;
                }
                if (myScreenAnswerUnsub) { myScreenAnswerUnsub(); myScreenAnswerUnsub = null; }
                if (myScreenHostCandUnsub) { myScreenHostCandUnsub(); myScreenHostCandUnsub = null; }
                localSharedVideo.srcObject = null;
                sharedVideoBox.style.display = 'none';
                isScreenSharing = false;
            }

            async function stopMyScreenShare() {
                stopMyScreenShareInternal();
                statusText.innerText = "画面共有が停止されました";
                await remove(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/rtc'));
            }

            function showChatOverlayWithPop() {
                if (peerChatOverlay.style.display !== 'flex') {
                    peerChatOverlay.style.display = 'flex';
                    peerChatOverlay.classList.remove('pop-in');
                    void peerChatOverlay.offsetWidth;
                    peerChatOverlay.classList.add('pop-in');
                }
            }

            // ==========================================================
            // ★ チャット表示制御：メッセージが1件でもあれば必ず表示
            // ==========================================================
            let hasAnyMessages = false;

            function updateChatVisibilityByMessages() {
                if (hasAnyMessages) {
                    showChatOverlayWithPop();
                }
                // メッセージが無い場合のみ、画面共有中でなければ閉じる
                // （画面共有中でもメッセージがあれば上で表示済み）
                if (!hasAnyMessages && !isScreenSharing) {
                    peerChatOverlay.style.display = 'none';
                }
            }

            onValue(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/modeCommand'), async (snapshot) => {
                const cmd = snapshot.val();
                if (!cmd) return;

                if (cmd.action === 'lockAll') {
                    stopMyScreenShareInternal();
                    // メッセージが無ければチャット欄を閉じる
                    if (!hasAnyMessages) {
                        peerChatOverlay.style.display = 'none';
                    }
                    activeContainer.style.display = 'none';
                    statusText.innerText = "接続完了：ホストからの指示を待っています...";

                } else if (cmd.action === 'requestScreenShare') {
                    stopMyScreenShareInternal();

                    activeContainer.style.display = 'flex';
                    sharedVideoBox.style.display = 'block';
                    // メッセージがあればチャットは表示したまま、無ければ隠す
                    if (!hasAnyMessages) {
                        peerChatOverlay.style.display = 'none';
                    }
                    statusText.innerText = "あなたの画面を全体共有中です";

                    try {
                        myScreenStream = await navigator.mediaDevices.getDisplayMedia({
                            video: { cursor: "always" },
                            audio: true
                        });
                        localSharedVideo.srcObject = myScreenStream;
                        isScreenSharing = true;

                        await remove(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/rtc'));

                        myScreenPc = new RTCPeerConnection(rtcConfig);
                        myScreenStream.getTracks().forEach(track => myScreenPc.addTrack(track, myScreenStream));

                        myScreenPc.onicecandidate = e => {
                            if (e.candidate) {
                                push(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/rtc/peerCandidates'), e.candidate.toJSON());
                            }
                        };

                        const offer = await myScreenPc.createOffer();
                        await myScreenPc.setLocalDescription(offer);
                        await set(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/rtc/offer'), {
                            type: offer.type,
                            sdp: offer.sdp,
                            time: Date.now()
                        });

                        myScreenAnswerUnsub = onValue(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/rtc/answer'), async (snap) => {
                            const ans = snap.val();
                            if (ans && myScreenPc && myScreenPc.signalingState === 'have-local-offer') {
                                try {
                                    await myScreenPc.setRemoteDescription(new RTCSessionDescription(ans));
                                } catch (e) {}
                            }
                        });

                        myScreenHostCandUnsub = onValue(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/rtc/hostCandidates'), (snap) => {
                            const cands = snap.val();
                            if (cands && myScreenPc) {
                                Object.values(cands).forEach(async c => {
                                    try { await myScreenPc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
                                });
                            }
                        });

                        myScreenStream.getVideoTracks()[0].onended = () => {
                            stopMyScreenShare();
                        };

                    } catch (err) {
                        statusText.innerText = "画面共有がキャンセルまたは拒否されました";
                        sharedVideoBox.style.display = 'none';
                        isScreenSharing = false;
                        await remove(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/rtc'));
                    }

                } else if (cmd.action === 'stopScreenShare') {
                    await stopMyScreenShare();
                    // メッセージが無ければチャットを閉じる
                    if (!hasAnyMessages) {
                        peerChatOverlay.style.display = 'none';
                    }

                } else if (cmd.action === 'openUrl') {
                    statusText.innerText = `指定サイトを開いています: ${cmd.url}`;
                    window.open(cmd.url, '_blank');
                }
            });

            // chatVisible は補助フラグとして扱う（メッセージ有無が最優先）
            onValue(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/chatVisible'), (snap) => {
                if (snap.val() === true) {
                    // フラグが立ったらチャット欄を表示（ただしメッセージが無くても）
                    showChatOverlayWithPop();
                } else {
                    // フラグが下りても、メッセージがあれば表示継続
                    if (!hasAnyMessages && !isScreenSharing) {
                        peerChatOverlay.style.display = 'none';
                    }
                }
            });

            // ==========================================================
            // ★ メッセージ受信：メッセージが1件でもあれば必ず表示
            // ==========================================================
            onValue(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/messages'), (snapshot) => {
                const data = snapshot.val();
                const box = document.getElementById('peerChatBox');
                box.innerHTML = '';

                const msgCount = data ? Object.keys(data).length : 0;
                hasAnyMessages = msgCount > 0;

                if (data) {
                    let hasNewHostMessage = false;

                    Object.entries(data).forEach(([msgId, msg]) => {
                        const isNew = !knownMessageIds.has(msgId);
                        const flash = isNew && msg.sender === 'host' && messageListenerInitialized;
                        box.appendChild(renderChatMessage(msg, false, flash));
                        knownMessageIds.add(msgId);
                        if (flash) hasNewHostMessage = true;
                    });

                    box.scrollTop = box.scrollHeight;

                    // ★ メッセージが1件でもあれば必ずチャット欄を表示
                    showChatOverlayWithPop();

                    // 未読タブマークは「新着」かつ「タブ非表示」のときだけ
                    if (hasNewHostMessage && document.hidden) {
                        setUnreadTitle(true);
                    }
                } else {
                    // メッセージが0件になった場合（通常は起きない）
                    if (!isScreenSharing) {
                        peerChatOverlay.style.display = 'none';
                    }
                }

                if (!messageListenerInitialized) {
                    messageListenerInitialized = true;
                }
            });

            async function sendPeerChat(imageObj = null) {
                const text = peerChatInput.value.trim();
                if (!text && !imageObj) return;

                let imgData = null;
                if (imageObj) {
                    try {
                        imgData = await convertImageFileToBase64(imageObj);
                    } catch (e) { return; }
                }

                push(ref(db, 'rooms/' + activeRoom + '/peers/' + myPeerId + '/messages'), {
                    sender: 'peer',
                    text: text || '',
                    image: imgData,
                    time: Date.now()
                });
                peerChatInput.value = '';
                peerImageInput.value = '';
            }

            peerPickImgBtn.addEventListener('click', () => peerImageInput.click());
            peerImageInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    sendPeerChat(e.target.files[0]);
                }
            });

            peerSendChatBtn.addEventListener('click', () => sendPeerChat());
            peerChatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendPeerChat();
            });

        } else {
            // ============================================================
            //  ホスト側
            // ============================================================
            let peersUnsub = null;
            const peerStates = {};

            async function generateSessionLink() {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return;

                const baseUrl = window.location.href.split('?')[0];
                const link = baseUrl + '?room=' + rId;

                const linkElem = document.getElementById('shareableLink');
                linkElem.href = link;
                linkElem.textContent = link;
                document.getElementById('resultZone').style.display = 'block';

                await remove(ref(db, 'rooms/' + rId));
                await set(ref(db, 'rooms/' + rId), { createdAt: Date.now() });

                monitorPeers(rId);
            }

            document.getElementById('generateBtn').addEventListener('click', generateSessionLink);

            function monitorPeers(rId) {
                if (peersUnsub) { peersUnsub(); peersUnsub = null; }

                peersUnsub = onValue(ref(db, 'rooms/' + rId + '/peers'), (snapshot) => {
                    const peers = snapshot.val() || {};
                    const container = document.getElementById('peerPanelsContainer');
                    const peerCountEl = document.getElementById('peerCount');
                    const noPeerMsg = document.getElementById('noPeerMessage');

                    const currentPeerIds = Object.keys(peers);
                    peerCountEl.textContent = currentPeerIds.length;

                    if (currentPeerIds.length === 0) {
                        if (noPeerMsg) noPeerMsg.style.display = 'block';
                    } else {
                        if (noPeerMsg) noPeerMsg.style.display = 'none';
                    }

                    Object.keys(peerStates).forEach(pid => {
                        if (!currentPeerIds.includes(pid)) {
                            cleanupPeerState(pid);
                        }
                    });

                    currentPeerIds.forEach((pid, idx) => {
                        if (!peerStates[pid]) {
                            createPeerPanel(rId, pid, idx);
                        }
                    });
                });
            }

            function cleanupPeerState(pid) {
                const st = peerStates[pid];
                if (!st) return;
                if (st.offerUnsub) st.offerUnsub();
                if (st.hostCandUnsub) st.hostCandUnsub();
                if (st.chatUnsub) st.chatUnsub();
                if (st.pc) st.pc.close();
                if (st.panelEl && st.panelEl.parentNode) {
                    st.panelEl.parentNode.removeChild(st.panelEl);
                }
                delete peerStates[pid];
            }

            function createPeerPanel(rId, pid, index) {
                const container = document.getElementById('peerPanelsContainer');

                const panel = document.createElement('div');
                panel.className = 'peer-panel';
                panel.dataset.peerId = pid;

                panel.innerHTML = `
                    <div class="peer-panel-header">
                        <div class="peer-panel-title">
                            👤 相手 #${index + 1}
                            <span class="peer-id-badge">${pid.substring(5)}</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <button class="btn-success peer-trigger-share">🖥️ 画面共有を要求</button>
                        <button class="btn-danger peer-stop-share" style="margin-top:0;">⏹️ 画面共有を停止</button>
                    </div>
                    <div class="form-group" style="margin-bottom:10px;">
                        <label>🎯 この相手に開かせるURL</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="url" class="peer-url-input" value="https://www.google.com" placeholder="https://example.com">
                            <button class="btn-primary peer-send-url" style="width: 140px;">URLを開かせる</button>
                        </div>
                    </div>
                    <div class="screen-share-box">
                        <div class="screen-placeholder">相手の画面共有を待っています...</div>
                        <video class="remote-video" autoplay playsinline></video>
                    </div>

                    <div class="peer-chat-section">
                        <div class="peer-chat-label">💬 この相手専用チャット</div>
                        <div class="peer-chat-box"></div>
                        <div class="peer-chat-input-row">
                            <input type="file" class="peer-img-file" accept="image/*" style="display: none;">
                            <button class="btn-icon peer-pick-img" title="画像を添付">📷</button>
                            <input type="text" class="peer-chat-input" placeholder="メッセージを入力して送信...">
                            <button class="btn-primary peer-send-chat" style="width: 90px;">送信</button>
                        </div>
                    </div>
                `;

                container.appendChild(panel);

                const remoteVideo = panel.querySelector('.remote-video');
                const placeholder = panel.querySelector('.screen-placeholder');
                const triggerBtn = panel.querySelector('.peer-trigger-share');
                const stopBtn = panel.querySelector('.peer-stop-share');
                const urlInput = panel.querySelector('.peer-url-input');
                const sendUrlBtn = panel.querySelector('.peer-send-url');
                const chatBox = panel.querySelector('.peer-chat-box');
                const chatInput = panel.querySelector('.peer-chat-input');
                const sendChatBtn = panel.querySelector('.peer-send-chat');
                const imgFile = panel.querySelector('.peer-img-file');
                const pickImgBtn = panel.querySelector('.peer-pick-img');

                const st = {
                    panelEl: panel,
                    pc: null,
                    offerUnsub: null,
                    hostCandUnsub: null,
                    chatUnsub: null
                };
                peerStates[pid] = st;

                triggerBtn.addEventListener('click', async () => {
                    await set(ref(db, 'rooms/' + rId + '/peers/' + pid + '/chatVisible'), false);
                    await remove(ref(db, 'rooms/' + rId + '/peers/' + pid + '/rtc'));
                    await set(ref(db, 'rooms/' + rId + '/peers/' + pid + '/modeCommand'), {
                        action: 'requestScreenShare',
                        time: Date.now()
                    });
                });

                stopBtn.addEventListener('click', async () => {
                    await set(ref(db, 'rooms/' + rId + '/peers/' + pid + '/modeCommand'), {
                        action: 'stopScreenShare',
                        time: Date.now()
                    });

                    if (st.offerUnsub) { st.offerUnsub(); st.offerUnsub = null; }
                    if (st.hostCandUnsub) { st.hostCandUnsub(); st.hostCandUnsub = null; }
                    if (st.pc) {
                        st.pc.close();
                        st.pc = null;
                    }
                    remoteVideo.srcObject = null;
                    placeholder.style.display = 'flex';

                    await remove(ref(db, 'rooms/' + rId + '/peers/' + pid + '/rtc'));
                });

                sendUrlBtn.addEventListener('click', async () => {
                    const targetUrl = urlInput.value.trim();
                    if (!targetUrl) return;
                    await set(ref(db, 'rooms/' + rId + '/peers/' + pid + '/modeCommand'), {
                        action: 'openUrl',
                        url: targetUrl,
                        time: Date.now()
                    });
                });

                async function sendChatToPeer(imageObj = null) {
                    const text = chatInput.value.trim();
                    if (!text && !imageObj) return;

                    let imgData = null;
                    if (imageObj) {
                        try {
                            imgData = await convertImageFileToBase64(imageObj);
                        } catch (e) { return; }
                    }

                    await set(ref(db, 'rooms/' + rId + '/peers/' + pid + '/chatVisible'), true);

                    push(ref(db, 'rooms/' + rId + '/peers/' + pid + '/messages'), {
                        sender: 'host',
                        text: text || '',
                        image: imgData,
                        time: Date.now()
                    });
                    chatInput.value = '';
                    imgFile.value = '';
                }

                sendChatBtn.addEventListener('click', () => sendChatToPeer());
                chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendChatToPeer();
                });

                pickImgBtn.addEventListener('click', () => imgFile.click());
                imgFile.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        sendChatToPeer(e.target.files[0]);
                    }
                });

                const knownHostMsgIds = new Set();
                let hostMsgInitialized = false;
                st.chatUnsub = onValue(ref(db, 'rooms/' + rId + '/peers/' + pid + '/messages'), (snapshot) => {
                    const data = snapshot.val();
                    chatBox.innerHTML = '';
                    if (data) {
                        let hasNewPeerMessage = false;
                        Object.entries(data).forEach(([msgId, msg]) => {
                            const isNew = !knownHostMsgIds.has(msgId);
                            const flash = isNew && msg.sender === 'peer' && hostMsgInitialized;
                            chatBox.appendChild(renderChatMessage(msg, true, flash));
                            knownHostMsgIds.add(msgId);
                            if (flash) hasNewPeerMessage = true;
                        });
                        chatBox.scrollTop = chatBox.scrollHeight;

                        if (hasNewPeerMessage && document.hidden) {
                            setUnreadTitle(true);
                        }
                    }
                    if (!hostMsgInitialized) hostMsgInitialized = true;
                });

                setupPeerWebRTCReceiver(rId, pid, st, remoteVideo, placeholder);
            }

            function setupPeerWebRTCReceiver(rId, pid, st, remoteVideo, placeholder) {
                if (st.offerUnsub) { st.offerUnsub(); st.offerUnsub = null; }
                if (st.hostCandUnsub) { st.hostCandUnsub(); st.hostCandUnsub = null; }

                st.offerUnsub = onValue(ref(db, 'rooms/' + rId + '/peers/' + pid + '/rtc/offer'), async (snapshot) => {
                    const offer = snapshot.val();

                    if (st.hostCandUnsub) { st.hostCandUnsub(); st.hostCandUnsub = null; }
                    if (st.pc) {
                        st.pc.close();
                        st.pc = null;
                    }

                    if (!offer) {
                        remoteVideo.srcObject = null;
                        placeholder.style.display = 'flex';
                        return;
                    }

                    st.pc = new RTCPeerConnection(rtcConfig);

                    st.pc.ontrack = e => {
                        remoteVideo.srcObject = e.streams[0];
                        placeholder.style.display = 'none';
                    };

                    st.pc.onicecandidate = e => {
                        if (e.candidate) {
                            push(ref(db, 'rooms/' + rId + '/peers/' + pid + '/rtc/hostCandidates'), e.candidate.toJSON());
                        }
                    };

                    try {
                        await st.pc.setRemoteDescription(new RTCSessionDescription(offer));
                        const answer = await st.pc.createAnswer();
                        await st.pc.setLocalDescription(answer);
                        await set(ref(db, 'rooms/' + rId + '/peers/' + pid + '/rtc/answer'), {
                            type: answer.type,
                            sdp: answer.sdp
                        });

                        st.hostCandUnsub = onValue(ref(db, 'rooms/' + rId + '/peers/' + pid + '/rtc/peerCandidates'), (snap) => {
                            const cands = snap.val();
                            if (cands && st.pc) {
                                Object.values(cands).forEach(async c => {
                                    try { await st.pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
                                });
                            }
                        });
                    } catch (e) {}
                });
            }

            document.getElementById('resetBtn').addEventListener('click', async () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return;

                Object.keys(peerStates).forEach(pid => cleanupPeerState(pid));

                if (peersUnsub) { peersUnsub(); peersUnsub = null; }

                await remove(ref(db, 'rooms/' + rId));
                location.reload();
            });

            window.addEventListener('beforeunload', () => {
                Object.keys(peerStates).forEach(pid => {
                    const st = peerStates[pid];
                    if (st.pc) st.pc.close();
                });
            });
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const link = document.getElementById('shareableLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ コピー完了！';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 コピー';
                    btn.classList.remove('copied');
                }, 2000);
            });
        });

        // ---- 背景粒子アニメーション ----
        const canvas = document.getElementById('particle-canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + this.alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 40; i++) {
            let p = new Particle();
            p.y = Math.random() * canvas.height;
            particles.push(p);
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(c => { c.update(); c.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
