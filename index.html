<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Dg 完全主導型マスターコントロール</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            position: relative;
            color: #1e293b;
        }

        /* ===== 背景粒子キャンバス ===== */
        #particle-canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 左上のドラゴンロゴ ===== */
        .dragon-logo-top-left {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            fill: #ffffff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            pointer-events: none;
            z-index: 5;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 28px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            max-width: 720px;
            width: 100%;
            margin: auto;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            max-height: 92vh;
            overflow-y: auto;
        }
        h2, h3 {
            margin-top: 0;
            color: #1e293b;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 8px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
            font-size: 0.95rem;
        }
        input[type="url"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            background: #fafbfc;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: white;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-primary:hover { background: #1d4ed8; transform: scale(1.01); }
        .btn-success {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-success:hover { background: #16a34a; }
        .btn-warning {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-warning:hover { background: #d97706; }
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger:hover { background: #b91c1c; }

        #resultZone {
            margin-top: 15px;
            padding: 14px;
            background: #f1f5f9;
            border-left: 6px solid #22c55e;
            border-radius: 10px;
            display: none;
        }
        .link-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            align-items: center;
        }
        .generated-link {
            flex: 1;
            background: #22c55e;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: 700;
            text-align: center;
            font-size: 0.9rem;
            word-break: break-all;
            display: inline-block;
        }
        .btn-copy {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-copy.copied { background: #22c55e; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-waiting { background: #e2e8f0; color: #64748b; }
        .status-connected { background: #dcfce7; color: #15803d; }

        /* ===== 画面共有ビュワー（ホスト側用） ===== */
        .screen-share-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
            aspect-ratio: 16/9;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .screen-placeholder {
            color: #64748b;
            font-size: 0.9rem;
            position: absolute;
        }

        /* ===== チャットボックス（ホスト側） ===== */
        .chat-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            height: 140px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-msg {
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .chat-msg.host { background: #dbeafe; color: #1e40af; align-self: flex-end; }
        .chat-msg.peer { background: #e2e8f0; color: #334155; align-self: flex-start; }
        .chat-input-row { display: flex; gap: 8px; }

        /* ===== 相手側の強制完全制御レイアウト ===== */
        #executeMode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0f19;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .dragon-logo-center {
            width: 160px;
            height: 160px;
            fill: #ffffff;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.8));
            animation: dragonPulse 2s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes dragonPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        #execStatusText {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 500;
        }

        /* 相手に急に出現するモーダルやチャット・画面共有領域 */
        #peerActiveContainer {
            display: none;
            width: 100%;
            max-width: 600px;
            margin-top: 15px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #peerChatBox {
            background: #0f172a;
            border-radius: 10px;
            height: 120px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #peerSharedVideoBox {
            display: none;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        #localSharedVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas-bg"></canvas>

    <svg class="dragon-logo-top-left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z" />
    </svg>

    <!-- ホスト側コントロールパネル -->
    <div id="setupMode" class="card">
        <h2>👑 Dg マスターコントロールパネル</h2>

        <div class="form-group">
            <label>📍 ルーム識別子 (ID)</label>
            <input type="text" id="roomIdInput" value="">
        </div>

        <button id="generateBtn" class="btn-primary">🔗 接続リンクを発行する</button>

        <div id="resultZone">
            <strong>✅ 発行完了（このリンクを相手に踏ませよう）</strong>
            <div class="link-container">
                <a id="shareableLink" class="generated-link" href="#" target="_blank">リンクを開く</a>
                <button id="copyBtn" class="btn-copy">📋 コピー</button>
            </div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>🎛️ あなた（ホスト）からの主導コントロール</h3>
        <p>相手の状態: <span id="peerStatusBadge" class="status-badge status-waiting">待機中...</span></p>

        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
            <button id="hostTriggerShareBtn" class="btn-success">🖥️ 相手に「画面共有」を強制要求する</button>
            <button id="hostShowMyScreenBtn" class="btn-warning">📺 あなたの画面を相手に送りつける</button>
        </div>

        <div class="form-group">
            <label for="targetUrlInput">🎯 相手に開かせるURL</label>
            <div style="display: flex; gap: 8px;">
                <input type="url" id="targetUrlInput" value="https://www.google.com" placeholder="https://example.com">
                <button id="sendUrlBtn" class="btn-primary" style="width: 140px;">URLを開かせる</button>
            </div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>📺 受信している相手の画面</h3>
        <div class="screen-share-box">
            <div id="screenPlaceholder" class="screen-placeholder">相手の画面共有を待っています...</div>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>💬 Jiffcy風 通話メッセージ・コントロール</h3>
        <div id="chatContainer" class="chat-box"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="メッセージを入力...">
            <button id="sendChatBtn" class="btn-primary" style="width: 100px;">送信</button>
        </div>

        <button id="resetBtn" class="btn-danger">🔄 全システムをリセット</button>
    </div>

    <!-- 相手側 完全に受動的な画面 -->
    <div id="executeMode">
        <svg class="dragon-logo-center" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z" />
        </svg>
        <div id="execStatusText">ホストからの接続を待っています...</div>

        <!-- ホストの指示で急に出現する機能コンテナ -->
        <div id="peerActiveContainer">
            <div id="peerSharedVideoBox">
                <video id="localSharedVideo" autoplay playsinline></video>
            </div>
            <div id="peerChatBox"></div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="peerChatInput" placeholder="メッセージを入力...">
                <button id="peerSendChatBtn" class="btn-primary" style="width: 80px;">送信</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKの読み込みと動作処理 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClr0xKgQ_7BLMdoLltDkYhKGKMFkqAk5Q",
            authDomain: "dongurityping.firebaseapp.com",
            databaseURL: "https://dongurityping-default-rtdb.firebaseio.com",
            projectId: "dongurityping",
            storageBucket: "dongurityping.firebasestorage.app",
            messagingSenderId: "892769145761",
            appId: "1:892769145761:web:6d3f18fa7f3f1bb55f71e0",
            measurementId: "G-9N1Q9NY4RH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultRoomId = 'room_' + Math.random().toString(36).substring(2, 8);
        document.getElementById('roomIdInput').value = defaultRoomId;

        const urlParams = new URLSearchParams(window.location.search);
        const activeRoom = urlParams.get('room');

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        if (activeRoom) {
            // ================= ゲスト側（相手：完全受動型） =================
            document.getElementById('setupMode').style.display = 'none';
            document.getElementById('executeMode').style.display = 'flex';

            const statusText = document.getElementById('execStatusText');
            const activeContainer = document.getElementById('peerActiveContainer');
            const sharedVideoBox = document.getElementById('peerSharedVideoBox');

            set(ref(db, 'rooms/' + activeRoom + '/status'), 'connected');
            statusText.innerText = "接続完了：ホストの指示を待っています...";

            // 1. ホストからの全体モード命令を監視
            onValue(ref(db, 'rooms/' + activeRoom + '/modeCommand'), async (snapshot) => {
                const cmd = snapshot.val();
                if (!cmd) return;

                if (cmd.action === 'showChat') {
                    activeContainer.style.display = 'block';
                    sharedVideoBox.style.display = 'none';
                    statusText.innerText = "通話メッセージセッションが開始されました";
                } else if (cmd.action === 'requestScreenShare') {
                    // 急にあなたの画面共有を求められる
                    activeContainer.style.display = 'block';
                    sharedVideoBox.style.display = 'block';
                    statusText.innerText = "ホストの要求により画面共有を開始しています...";

                    try {
                        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                        const pc = new RTCPeerConnection(rtcConfig);
                        stream.getTracks().forEach(track => pc.addTrack(track, stream));

                        pc.onicecandidate = e => {
                            if (e.candidate) push(ref(db, 'rooms/' + activeRoom + '/rtc/peerCandidates'), e.candidate.toJSON());
                        };

                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        set(ref(db, 'rooms/' + activeRoom + '/rtc/offer'), { type: offer.type, sdp: offer.sdp });

                        onValue(ref(db, 'rooms/' + activeRoom + '/rtc/answer'), async (snap) => {
                            const ans = snap.val();
                            if (ans && pc && !pc.currentRemoteDescription) {
                                await pc.setRemoteDescription(new RTCSessionDescription(ans));
                            }
                        });

                        onValue(ref(db, 'rooms/' + activeRoom + '/rtc/hostCandidates'), (snap) => {
                            const cands = snap.val();
                            if (cands) {
                                Object.values(cands).forEach(async c => {
                                    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                                });
                            }
                        });

                        stream.getVideoTracks()[0].onended = () => {
                            statusText.innerText = "画面共有が終了しました";
                            pc.close();
                        };
                    } catch(err) {
                        statusText.innerText = "画面共有が拒否されたかキャンセルされました";
                    }
                } else if (cmd.action === 'openUrl') {
                    statusText.innerText = `サイトが指定されました: ${cmd.url}`;
                    window.open(cmd.url, '_blank');
                }
            });

            // 2. ホスト画面受信の監視（ホストの画面共有を受け取る場合）
            onValue(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/offer'), async (snapshot) => {
                const offer = snapshot.val();
                if (!offer) return;

                activeContainer.style.display = 'block';
                sharedVideoBox.style.display = 'block';
                statusText.innerText = "ホストの画面を受信しています";

                const pc = new RTCPeerConnection(rtcConfig);
                pc.ontrack = e => {
                    document.getElementById('localSharedVideo').srcObject = e.streams[0];
                };
                pc.onicecandidate = e => {
                    if (e.candidate) push(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/peerCandidates'), e.candidate.toJSON());
                };

                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                set(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/answer'), { type: answer.type, sdp: answer.sdp });

                onValue(ref(db, 'rooms/' + activeRoom + '/rtcHostToPeer/hostCandidates'), (snap) => {
                    const cands = snap.val();
                    if (cands) {
                        Object.values(cands).forEach(async c => {
                            try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                        });
                    }
                });
            });

            // 3. チャット同期
            onValue(ref(db, 'rooms/' + activeRoom + '/messages'), (snapshot) => {
                const data = snapshot.val();
                const box = document.getElementById('peerChatBox');
                box.innerHTML = '';
                if (data) {
                    Object.values(data).forEach(msg => {
                        const div = document.createElement('div');
                        div.textContent = (msg.sender === 'host' ? '👑 ホスト' : 'あなた') + ': ' + msg.text;
                        box.appendChild(div);
                    });
                    box.scrollTop = box.scrollHeight;
                }
            });

            function sendPeerChat() {
                const input = document.getElementById('peerChatInput');
                const text = input.value.trim();
                if (!text) return;
                push(ref(db, 'rooms/' + activeRoom + '/messages'), {
                    sender: 'peer',
                    text: text,
                    time: Date.now()
                });
                input.value = '';
            }

            document.getElementById('peerSendChatBtn').addEventListener('click', sendPeerChat);
            document.getElementById('peerChatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendPeerChat();
            });

        } else {
            // ================= ホスト側の処理（完全主導権） =================
            let currentPc = null;

            function generateSessionLink() {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームIDを入力してください');

                const baseUrl = window.location.href.split('?')[0];
                const link = baseUrl + '?room=' + rId;

                const linkElem = document.getElementById('shareableLink');
                linkElem.href = link;
                linkElem.textContent = link;
                document.getElementById('resultZone').style.display = 'block';

                set(ref(db, 'rooms/' + rId), {
                    status: 'waiting',
                    modeCommand: { action: 'none' }
                });

                monitorRoom(rId);
                monitorChat(rId);
                setupWebRTCReceiver(rId);
            }

            document.getElementById('generateBtn').addEventListener('click', generateSessionLink);

            function monitorRoom(rId) {
                const badge = document.getElementById('peerStatusBadge');
                onValue(ref(db, 'rooms/' + rId + '/status'), (snapshot) => {
                    if (snapshot.val() === 'connected') {
                        badge.innerText = "相手が接続しました！完全制御可能";
                        badge.className = "status-badge status-connected";
                    }
                });
            }

            // ホストから「相手の画面共有」を要求する
            document.getElementById('hostTriggerShareBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームIDがありません');

                set(ref(db, 'rooms/' + rId + '/modeCommand'), {
                    action: 'requestScreenShare',
                    time: Date.now()
                });
                alert("相手に画面共有を強制要求しました。相手の画面が切り替わります。");
            });

            // ホストからチャット/通話画面を開かせる
            function openChatMode() {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return;
                set(ref(db, 'rooms/' + rId + '/modeCommand'), {
                    action: 'showChat',
                    time: Date.now()
                });
            }

            // ホストの画面を相手に送りつけるボタン
            document.getElementById('hostShowMyScreenBtn').addEventListener('click', async () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームIDがありません');

                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const pc = new RTCPeerConnection(rtcConfig);
                    stream.getTracks().forEach(track => pc.addTrack(track, stream));

                    pc.onicecandidate = e => {
                        if (e.candidate) push(ref(db, 'rooms/' + rId + '/rtcHostToPeer/hostCandidates'), e.candidate.toJSON());
                    };

                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    set(ref(db, 'rooms/' + rId + '/rtcHostToPeer/offer'), { type: offer.type, sdp: offer.sdp });

                    onValue(ref(db, 'rooms/' + rId + '/rtcHostToPeer/answer'), async (snap) => {
                        const ans = snap.val();
                        if (ans && pc && !pc.currentRemoteDescription) {
                            await pc.setRemoteDescription(new RTCSessionDescription(ans));
                        }
                    });

                    onValue(ref(db, 'rooms/' + rId + '/rtcHostToPeer/peerCandidates'), (snap) => {
                        const cands = snap.val();
                        if (cands) {
                            Object.values(cands).forEach(async c => {
                                try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                            });
                        }
                    });

                    alert("あなたの画面を相手に送信開始しました！");
                } catch(err) {
                    alert("画面共有がキャンセルされました。");
                }
            });

            // 相手側から送られてくる画面共有を受信 (WebRTC)
            function setupWebRTCReceiver(rId) {
                onValue(ref(db, 'rooms/' + rId + '/rtc/offer'), async (snapshot) => {
                    const offer = snapshot.val();
                    if (!offer) return;

                    const pc = new RTCPeerConnection(rtcConfig);
                    pc.ontrack = e => {
                        const remoteVideo = document.getElementById('remoteVideo');
                        remoteVideo.srcObject = e.streams[0];
                        document.getElementById('screenPlaceholder').style.display = 'none';
                    };
                    pc.onicecandidate = e => {
                        if (e.candidate) push(ref(db, 'rooms/' + rId + '/rtc/hostCandidates'), e.candidate.toJSON());
                    };

                    await pc.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    set(ref(db, 'rooms/' + rId + '/rtc/answer'), { type: answer.type, sdp: answer.sdp });

                    onValue(ref(db, 'rooms/' + rId + '/rtc/peerCandidates'), (snapshot) => {
                        const cands = snapshot.val();
                        if (cands) {
                            Object.values(cands).forEach(async c => {
                                try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
                            });
                        }
                    });
                });
            }

            document.getElementById('sendUrlBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                const targetUrl = document.getElementById('targetUrlInput').value.trim();
                if (!rId || !targetUrl) return alert('IDまたはURLを入力してください');

                set(ref(db, 'rooms/' + rId + '/modeCommand'), {
                    action: 'openUrl',
                    url: targetUrl,
                    time: Date.now()
                }).then(() => {
                    alert("指定URLを相手の画面で開かせました！");
                });
            });

            function sendHostChat() {
                const rId = document.getElementById('roomIdInput').value.trim();
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text || !rId) return;

                openChatMode(); // チャットを送る＝相手に自動でチャット画面を表示させる
                push(ref(db, 'rooms/' + rId + '/messages'), {
                    sender: 'host',
                    text: text,
                    time: Date.now()
                });
                input.value = '';
            }

            document.getElementById('sendChatBtn').addEventListener('click', sendHostChat);
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendHostChat();
            });

            function monitorChat(rId) {
                onValue(ref(db, 'rooms/' + rId + '/messages'), (snapshot) => {
                    const data = snapshot.val();
                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = '';
                    if (data) {
                        Object.values(data).forEach(msg => {
                            const div = document.createElement('div');
                            div.className = 'chat-msg ' + msg.sender;
                            div.textContent = (msg.sender === 'host' ? '自分' : '相手') + ': ' + msg.text;
                            chatContainer.appendChild(div);
                        });
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                });
            }

            document.getElementById('resetBtn').addEventListener('click', () => {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return;
                remove(ref(db, 'rooms/' + rId));
                alert("システムをリセットしました。");
                location.reload();
            });
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const link = document.getElementById('shareableLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅ コピー完了！';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋 コピー'; btn.classList.remove('copied'); }, 2000);
            });
        });

        // 背景粒子アニメーション
        const canvas = document.getElementById('particle-canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + this.alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 40; i++) {
            let p = new Particle();
            p.y = Math.random() * canvas.height;
            particles.push(p);
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
