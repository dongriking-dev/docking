<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Dg 完全主導型コントロールシステム</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            position: relative;
            color: #1e293b;
        }

        /* ===== 背景粒子キャンバス ===== */
        #particle-canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 左上のドラゴンロゴ ===== */
        .dragon-logo-top-left {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            fill: #ffffff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            pointer-events: none;
            z-index: 5;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 28px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            max-width: 620px;
            width: 100%;
            margin: auto;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            max-height: 90vh;
            overflow-y: auto;
        }
        h2, h3 {
            margin-top: 0;
            color: #1e293b;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 8px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
            font-size: 0.95rem;
        }
        input[type="url"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            background: #fafbfc;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: white;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-primary:hover { background: #1d4ed8; transform: scale(1.01); }
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger:hover { background: #b91c1c; }

        #resultZone {
            margin-top: 15px;
            padding: 14px;
            background: #f1f5f9;
            border-left: 6px solid #22c55e;
            border-radius: 10px;
            display: none;
        }
        .link-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            align-items: center;
        }
        .generated-link {
            flex: 1;
            background: #22c55e;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 30px;
            font-weight: 700;
            text-align: center;
            font-size: 0.9rem;
            word-break: break-all;
            display: inline-block;
        }
        .btn-copy {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-copy.copied { background: #22c55e; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-waiting { background: #e2e8f0; color: #64748b; }
        .status-connected { background: #dcfce7; color: #15803d; }

        /* ===== チャットボックス ===== */
        .chat-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            height: 140px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-msg {
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .chat-msg.host { background: #dbeafe; color: #1e40af; align-self: flex-end; }
        .chat-msg.peer { background: #e2e8f0; color: #334155; align-self: flex-start; }
        .chat-input-row { display: flex; gap: 8px; }

        /* ===== 相手側のフルスクリーン強制制御レイアウト ===== */
        #executeMode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0f19;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .dragon-logo-center {
            width: 200px;
            height: 200px;
            fill: #ffffff;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.8));
            animation: dragonPulse 2s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes dragonPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        #execStatusText {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #94a3b8;
        }

        .permission-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        /* 相手画面の簡易メッセージ表示用 */
        .peer-floating-chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            padding: 12px;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10000;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 背景粒子キャンバス -->
    <canvas id="particle-canvas-bg"></canvas>

    <!-- 左上のロゴ -->
    <svg class="dragon-logo-top-left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z" />
    </svg>

    <!-- ================= 1. ホスト側管理パネル（自分中心） ================= -->
    <div id="setupMode" class="card">
        <h2>🌰 Dg 完全主導型マスターパネル</h2>

        <div class="form-group">
            <label>📍 ルーム識別子 (ID)</label>
            <input type="text" id="roomIdInput" placeholder="例: room_001">
        </div>

        <button class="btn-primary" onclick="generateSessionLink()">🔗 接続リンクを発行する</button>

        <div id="resultZone">
            <strong>✅ 発行完了（このリンクを相手に踏ませよう）</strong>
            <div class="link-container">
                <a id="shareableLink" class="generated-link" href="#" target="_blank">リンクを開く</a>
                <button class="btn-copy" onclick="copyGeneratedLink()">📋 コピー</button>
            </div>
        </div>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>🎛️ 相手の強制コントロール</h3>
        <p>相手の状態: <span id="peerStatusBadge" class="status-badge status-waiting">待機中...</span></p>

        <div class="form-group">
            <label for="targetUrlInput">🎯 相手に開かせるURL</label>
            <input type="url" id="targetUrlInput" value="https://www.google.com" placeholder="https://example.com">
        </div>
        <button class="btn-primary" onclick="sendModeCommand('url')">🚀 指定URLを相手に強制表示する</button>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <h3>💬 Jiffcy風 通話メッセージ</h3>
        <div id="chatContainer" class="chat-box"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="メッセージを入力..." onkeypress="checkEnter(event)">
            <button class="btn-primary" style="width: 100px;" onclick="sendChatMessage()">送信</button>
        </div>

        <button class="btn-danger" onclick="sendResetCommand()">🔄 全システムをリセット</button>
    </div>

    <!-- ================= 2. 相手側 実行モード ================= -->
    <div id="executeMode">
        <svg class="dragon-logo-center" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C40,66 48,58 52,48 C50,58 44,68 36,82 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z" />
        </svg>
        <div id="execStatusText">接続完了：ホストからの指示を待っています...</div>
        <button id="openUrlBtn" class="permission-btn" style="display: none;">🔗 指定されたサイトを開く</button>

        <!-- 相手側のフローティングチャット -->
        <div id="peerFloatingChat" class="peer-floating-chat">
            <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;">💬 メッセージ・通話</div>
            <div id="peerMiniChatBox" style="height: 70px; overflow-y: auto; font-size: 0.85rem; margin-bottom: 6px; text-align: left;"></div>
            <div style="display: flex; gap: 4px;">
                <input type="text" id="peerChatInput" placeholder="返信..." style="padding: 6px; font-size: 0.85rem;" onkeypress="checkPeerEnter(event)">
                <button class="btn-primary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="sendPeerChatMessage()">送信</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKの読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClr0xKgQ_7BLMdoLltDkYhKGKMFkqAk5Q",
            authDomain: "dongurityping.firebaseapp.com",
            databaseURL: "https://dongurityping-default-rtdb.firebaseio.com",
            projectId: "dongurityping",
            storageBucket: "dongurityping.firebasestorage.app",
            messagingSenderId: "892769145761",
            appId: "1:892769145761:web:6d3f18fa7f3f1bb55f71e0",
            measurementId: "G-9N1Q9NY4RH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ランダムなルームID初期値
        const randomRoomId = 'room_' + Math.random().toString(36).substring(2, 8);
        document.getElementById('roomIdInput').value = randomRoomId;

        const urlParams = new URLSearchParams(window.location.search);
        const activeRoom = urlParams.get('room');

        if (activeRoom) {
            // ================= ゲスト側（相手）の処理 =================
            document.getElementById('setupMode').style.display = 'none';
            document.getElementById('executeMode').style.display = 'flex';

            const statusText = document.getElementById('execStatusText');
            const openBtn = document.getElementById('openUrlBtn');

            // 接続状態を通知
            set(ref(db, 'rooms/' + activeRoom + '/status'), 'connected');

            // ホストからのURL指示を監視
            onValue(ref(db, 'rooms/' + activeRoom + '/command'), (snapshot) => {
                const cmd = snapshot.val();
                if (!cmd || !cmd.url) return;

                statusText.innerText = `新しいサイトが指定されました: ${cmd.url}`;
                
                // 新しいタブで自動で開くを試みる
                const newWindow = window.open(cmd.url, '_blank');
                
                // ポップアップブロックなどで開かなかった場合のボタン表示
                openBtn.style.display = 'inline-block';
                openBtn.onclick = () => {
                    window.open(cmd.url, '_blank');
                };
            });

            // チャット同期
            onValue(ref(db, 'rooms/' + activeRoom + '/messages'), (snapshot) => {
                const data = snapshot.val();
                const chatBox = document.getElementById('peerMiniChatBox');
                chatBox.innerHTML = '';
                document.getElementById('peerFloatingChat').style.display = 'block';

                if (data) {
                    Object.values(data).forEach(msg => {
                        const div = document.createElement('div');
                        div.textContent = (msg.sender === 'host' ? '👑ホスト' : 'あなた') + ': ' + msg.text;
                        chatBox.appendChild(div);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });

            window.sendPeerChatMessage = function() {
                const input = document.getElementById('peerChatInput');
                const text = input.value.trim();
                if (!text) return;
                push(ref(db, 'rooms/' + activeRoom + '/messages'), {
                    sender: 'peer',
                    text: text,
                    time: Date.now()
                });
                input.value = '';
            };
            window.checkPeerEnter = function(e) { if (e.key === 'Enter') sendPeerChatMessage(); }

        } else {
            // ================= ホスト側の処理（自分中心） =================
            window.generateSessionLink = function() {
                const rId = document.getElementById('roomIdInput').value.trim();
                if (!rId) return alert('ルームIDを入力してください');

                const baseUrl = window.location.href.split('?')[0];
                const link = baseUrl + '?room=' + rId;

                const linkElem = document.getElementById('shareableLink');
                linkElem.href = link;
                linkElem.textContent = link;
                document.getElementById('resultZone').style.display = 'block';

                set(ref(db, 'rooms/' + rId), {
                    status: 'waiting',
                    command: { type: 'url', url: '' }
                });

                monitorRoom(rId);
                monitorChat(rId);
            };

            function monitorRoom(rId) {
                const badge = document.getElementById('peerStatusBadge');
                onValue(ref(db, 'rooms/' + rId + '/status'), (snapshot) => {
                    if (snapshot.val() === 'connected') {
                        badge.innerText = "相手が接続しました！";
                        badge.className = "status-badge status-connected";
                    }
                });
            }

            window.sendModeCommand = function(type) {
                const rId = document.getElementById('roomIdInput'].value.trim();
                if (!rId) return alert('ルームIDがありません');

                const targetUrl = document.getElementById('targetUrlInput').value.trim();
                if (!targetUrl) return alert('URLを入力してください');

                set(ref(db, 'rooms/' + rId + '/command'), {
                    type: type,
                    url: targetUrl,
                    time: Date.now()
                }).then(() => {
                    alert("指定URLを相手の画面に送信しました！");
                });
            };

            window.sendChatMessage = function() {
                const rId = document.getElementById('roomIdInput').value.trim();
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text || !rId) return;

                push(ref(db, 'rooms/' + rId + '/messages'), {
                    sender: 'host',
                    text: text,
                    time: Date.now()
                });
                input.value = '';
            };

            window.checkEnter = function(e) { if (e.key === 'Enter') sendChatMessage(); }

            function monitorChat(rId) {
                onValue(ref(db, 'rooms/' + rId + '/messages'), (snapshot) => {
                    const data = snapshot.val();
                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = '';
                    if (data) {
                        Object.values(data).forEach(msg => {
                            const div = document.createElement('div');
                            div.className = 'chat-msg ' + msg.sender;
                            div.textContent = (msg.sender === 'host' ? '自分' : '相手') + ': ' + msg.text;
                            chatContainer.appendChild(div);
                        });
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                });
            }
        }

        // 共通リンクコピー機能
        window.copyGeneratedLink = function() {
            const link = document.getElementById('shareableLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.textContent = '✅ コピー完了！';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋 コピー'; btn.classList.remove('copied'); }, 2000);
            });
        };

        window.sendResetCommand = function() {
            const rId = document.getElementById('roomIdInput').value.trim();
            if (!rId) return;
            set(ref(db, 'rooms/' + rId), { status: 'waiting', command: { type: 'url', url: '' } });
            alert("システムをリセットしました。");
        };

        // 背景粒子アニメーション
        const canvas = document.getElementById('particle-canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + this.alpha + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 40; i++) {
            let p = new Particle();
            p.y = Math.random() * canvas.height;
            particles.push(p);
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
